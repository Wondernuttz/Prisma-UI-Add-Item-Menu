<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prisma UI AddItem Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Two views, drill-down navigation:
           #modsView : top-level mod list with search.
           #itemsView: items belonging to the selected mod, with search + pagination + add. -->

    <div id="root">

        <!-- ─── View 1: Mod list ────────────────────────────────────────── -->
        <section id="modsView" class="view active">
            <header>
                <h1>ADD ITEM MENU</h1>
                <button class="closeBtn" data-action="close" title="Close">×</button>
            </header>

            <div class="filters">
                <input id="modSearch" type="text" placeholder="Filter mods…" autocomplete="off">
                <label class="toggle">
                    <input type="checkbox" id="excludeVanillaToggle">
                    <span>Hide vanilla</span>
                </label>
            </div>

            <div class="status" id="modsStatus">Loading mod list…</div>

            <div class="list-container">
                <ul id="modList"></ul>
            </div>
        </section>

        <!-- ─── View 2: Items in a single mod (or all mods) ─────────────── -->
        <section id="itemsView" class="view">
            <header>
                <button class="backBtn" data-action="back" title="Back">‹ MODS</button>
                <h1 id="itemsTitle">Items</h1>
                <button class="closeBtn" data-action="close" title="Close">×</button>
            </header>

            <!-- SkyUI bar: big category title left, search right -->
            <div class="skyui-bar">
                <div id="catTitle" class="cat-title">ALL</div>
                <input id="itemSearch" type="text" placeholder="Search…" autocomplete="off">
            </div>

            <!-- SkyUI-style icon category bar -->
            <nav class="tabs" id="tabs">
                <button class="tab active" data-type="" title="All">
                    <svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.6 7 .5-5.4 4.5 1.8 6.8-6-3.8-6 3.8 1.8-6.8L2.4 9.1l7-.5z"/></svg>
                </button>
                <button class="tab" data-type="WEAP" title="Weapons">
                    <svg viewBox="0 0 24 24"><path d="M19.6 2.9l1.5 1.5-9.3 9.3 1.9 1.9-1.4 1.4-1.5-1.5-3.3 3.3c-.5.5-1.3.5-1.8 0s-.5-1.3 0-1.8l3.3-3.3-1.5-1.5 1.4-1.4 1.9 1.9 9.3-9.3-.5-.5z"/></svg>
                </button>
                <button class="tab" data-type="ARMO" title="Armor">
                    <svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3zm0 2.2L6 6.4v4.6c0 3.9 2.5 7.4 6 8.8 3.5-1.4 6-4.9 6-8.8V6.4l-6-2.2z"/></svg>
                </button>
                <button class="tab" data-type="POTN" title="Potions">
                    <svg viewBox="0 0 24 24"><path d="M10 2h4v2h-1v4.2l4.6 7.6A3 3 0 0 1 15 21H9a3 3 0 0 1-2.6-5.2L11 8.2V4h-1V2zm1.6 8.1L8.2 15.7a1 1 0 0 0 .9 1.5h5.8a1 1 0 0 0 .9-1.5l-3.4-5.6h-.8z"/></svg>
                </button>
                <button class="tab" data-type="POIS" title="Poisons">
                    <svg viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8c0 3 1.6 5.5 4 6.8V20a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3.2c2.4-1.3 4-3.8 4-6.8a8 8 0 0 0-8-8zM8.5 11.5a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6zm7 0a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6zM10 14h4l-2 3-2-3z"/></svg>
                </button>
                <button class="tab" data-type="FOOD" title="Food">
                    <svg viewBox="0 0 24 24"><path d="M12 6c1-2 3-3.2 3-3.2s.2 2-.8 3.4C16.6 5.9 19 7.6 19 11c0 4.4-3 9-5.5 9-.9 0-1-.5-1.5-.5s-.6.5-1.5.5C8 20 5 15.4 5 11c0-3.4 2.4-5.1 4.8-4.8C8.8 4.8 9 2.8 9 2.8S11 3.9 12 6z"/></svg>
                </button>
                <button class="tab" data-type="INGR" title="Ingredients">
                    <svg viewBox="0 0 24 24"><path d="M5 21c0-9 5-15 14-16-1 9-6 14-12 14 0 0-1 .2-2 2zm2.5-4.5c3.8-1 6.6-3.8 8.5-8.5-4.7 1.9-7.5 4.7-8.5 8.5z"/></svg>
                </button>
                <button class="tab" data-type="BOOK" title="Books">
                    <svg viewBox="0 0 24 24"><path d="M6.5 2H19a1 1 0 0 1 1 1v17a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 18.5v-14A2.5 2.5 0 0 1 6.5 2zM6 16.1c.16-.06.33-.1.5-.1H18V4H6.5a.5.5 0 0 0-.5.5v11.6zM6.5 18a.5.5 0 0 0 0 1H18v-1H6.5z"/></svg>
                </button>
                <button class="tab" data-type="STOM" title="Spell Tomes">
                    <svg viewBox="0 0 24 24"><path d="M12 5c-1.8-1.3-4.4-2-8-2v15c3.6 0 6.2.7 8 2 1.8-1.3 4.4-2 8-2V3c-3.6 0-6.2.7-8 2zm-1 12.6c-1.4-.7-3.1-1.1-5-1.3V5.2c1.9.2 3.6.6 5 1.3v11.1zm7-1.3c-1.9.2-3.6.6-5 1.3V6.5c1.4-.7 3.1-1.1 5-1.3v11.1z"/></svg>
                </button>
                <button class="tab" data-type="MISC" title="Misc">
                    <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5zm0 2.3L5.6 7.9 12 11.4l6.4-3.5L12 4.3zM5 9.6l6 3.3v6.5l-6-3.3V9.6zm14 0v6.5l-6 3.3v-6.5l6-3.3z"/></svg>
                </button>
                <button class="tab" data-type="AMMO" title="Ammo">
                    <svg viewBox="0 0 24 24"><path d="M21 3l-11.5 11.5-1.9-.4-3.3 3.3 2.5.8.8 2.5 3.3-3.3-.4-1.9L22 4l-1-1zM6.2 18.6l-.8-.8.9-.9.8.8-.9.9z"/></svg>
                </button>
                <button class="tab" data-type="SLGM" title="Soul Gems">
                    <svg viewBox="0 0 24 24"><path d="M7 3h10l4 6-9 12L3 9l4-6zm1.1 2L5.5 8.9 12 17.5l6.5-8.6L15.9 5H8.1z"/></svg>
                </button>
                <button class="tab" data-type="KEYM" title="Keys">
                    <svg viewBox="0 0 24 24"><path d="M14.5 2a7.5 7.5 0 0 0-7.2 9.6L2 17v3.5h3.5V18H8v-2.5h2.5l.9-.9A7.5 7.5 0 1 0 14.5 2zm2 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
                </button>
            </nav>

            <div class="status" id="itemsStatus">Loading…</div>

            <div class="item-body">
                <div class="list-container">
                    <div class="item-list-header" aria-hidden="true">
                        <span class="name">Name</span>
                        <span class="type">Type</span>
                        <span class="weight">Weight</span>
                        <span class="value">Value</span>
                    </div>
                    <ul id="itemList"></ul>
                    <!-- Selection nav: tap = prev/next item, hold = repeat (scroll-like) -->
                    <button id="navUp" class="list-nav up" title="Previous item (hold to repeat)">&#9650;</button>
                    <button id="navDown" class="list-nav down" title="Next item (hold to repeat)">&#9660;</button>
                </div>

                <!-- 3D preview pane: only revealed when the PrismaUI ModelPreview API exists -->
                <aside id="previewPane" class="preview-pane hidden">
                    <div id="previewTop" class="preview-top">
                        <span class="bright-icon" title="Lighting">&#9728;</span>
                        <input id="pvBright" type="range" min="20" max="250" value="100" title="Adjust lighting on the model">
                    </div>
                    <div id="previewRect"></div>
                    <div id="previewCtrls" class="preview-ctrls">
                        <button id="pvLeft" title="Pan left">&#9664;</button>
                        <button id="pvUp" title="Pan up">&#9650;</button>
                        <button id="pvDown" title="Pan down">&#9660;</button>
                        <button id="pvRight" title="Pan right">&#9654;</button>
                        <input id="pvZoom" type="range" min="25" max="400" value="100" title="Zoom">
                        <button id="pvSpin" title="Start/stop rotation">&#9208;</button>
                        <button id="pvRoll" title="Rotate 45&#176;">&#8635;</button>
                        <button id="pvReset" title="Reset view">&#8634;</button>
                    </div>
                    <div id="previewHint">3D Preview</div>
                </aside>
            </div>

            <footer>
                <div class="qty">
                    <button id="qtyMinus" title="Decrease">−</button>
                    <input id="qtyInput" type="number" min="1" max="32767" value="1">
                    <button id="qtyPlus" title="Increase">+</button>
                </div>
                <div class="qty-presets">
                    <button class="preset" data-qty="1"    title="Set quantity to 1">×1</button>
                    <button class="preset" data-qty="10"   title="Set quantity to 10">×10</button>
                    <button class="preset" data-qty="100"  title="Set quantity to 100">×100</button>
                    <button class="preset" data-qty="1000" title="Set quantity to 1000">×1000</button>
                </div>
                <button id="qtyLock" class="qty-lock" type="button" aria-pressed="false" title="Keep the selected quantity after each action">Lock Qty</button>
                <button id="useBtn" class="hidden" disabled>No Direct Action</button>
                <button id="addBtn" disabled>Add to Inventory</button>
                <div id="pager">
                    <button id="prevPage" disabled>‹ Prev</button>
                    <span id="pageLabel">page 1</span>
                    <button id="nextPage" disabled>Next ›</button>
                </div>
            </footer>
        </section>

    </div>

    <div id="addToast" class="add-toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
